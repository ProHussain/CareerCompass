plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.hashmac.careercompass'
    compileSdk 34

    defaultConfig {
        applicationId "com.hashmac.careercompass"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    // UI dependencies
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Toast
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Animations
    implementation('com.airbnb.android:lottie:6.2.0')

    // Jetpack Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.activity:activity:1.8.2'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // LiveData
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Timber
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // Firebase
    implementation 'com.google.firebase:firebase-analytics:21.6.2'
    implementation 'com.google.firebase:firebase-auth:22.3.1'
    implementation 'com.google.firebase:firebase-firestore:24.11.1'

    // Generative AI
    implementation'com.google.ai.client.generativeai:generativeai:0.5.0'

    // Progress Bar
    implementation 'com.github.lzyzsd:circleprogress:1.2.4'
//    implementation 'com.github.Marvel999:Arc-Progressbar-lib:1.0.0'
//    implementation 'com.jackandphantom.android:circularprogressbar:1.2.0'

    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}